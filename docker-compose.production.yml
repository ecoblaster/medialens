services:
  medialens:
    image: ecoblaster/medialens:${MEDIALENS_IMAGE_TAG:-1.1.0}
    container_name: medialens
    environment:
      MEDIALENS_APP_NAME: MediaLens
      MEDIALENS_APP_VERSION: 1.1.0
      MEDIALENS_API_V1_PREFIX: /api/v1
      MEDIALENS_DATABASE_URL: sqlite:////data/medialens.db
      MEDIALENS_AUTO_SCAN_ENABLED: ${MEDIALENS_AUTO_SCAN_ENABLED:-true}
      MEDIALENS_FILE_STABILITY_SECONDS: ${MEDIALENS_FILE_STABILITY_SECONDS:-60}
      MEDIALENS_RECONCILE_MINUTES: ${MEDIALENS_RECONCILE_MINUTES:-15}
    ports:
      - "${MEDIALENS_HOST_PORT:-8090}:8080"
    volumes:
      - "${MEDIALENS_DATA_PATH:-./data}:/data"
      - "${MEDIALENS_MOVIES_PATH:-/mnt/user/Media/Movies}:/media/movies:ro"
      - "${MEDIALENS_TV_PATH:-/mnt/user/Media/TV Shows}:/media/tv:ro"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/v1/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
